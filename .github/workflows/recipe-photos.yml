name: Recipe photo research (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install Pillow==11.3.0
      - run: python3 atlas-gastronomico/scripts/review-recipe-photos.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldbites-photo-candidates
          path: photo-review/
          retention-days: 7
