name: Import Argentina asado image

on:
  push:
    branches:
      - fix/argentina-asado-photo-20260923
    paths:
      - '.tmp-asado/**'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode image and update metadata
        run: |
          set -euo pipefail
          mkdir -p atlas-gastronomico/public/images/recipes-v2
          cat .tmp-asado/part*.txt | tr -d '\n' | base64 -d > atlas-gastronomico/public/images/recipes-v2/asado-argentino-a-la-parrilla.webp
          python3 -m pip install Pillow==11.3.0
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json, hashlib

          root = Path("atlas-gastronomico")
          slug = "asado-argentino-a-la-parrilla"
          full = root / "public/images/recipes-v2" / f"{slug}.webp"
          thumb = root / "public/images/recipes-v2" / f"{slug}-480.webp"

          with Image.open(full) as image:
              image.load()
              assert image.format == "WEBP", image.format
              assert image.size == (800, 600), image.size
              thumb_image = image.convert("RGB").resize((480, 360), Image.Resampling.LANCZOS)
              thumb_image.save(thumb, "WEBP", quality=78, method=6)

          photos_path = root / "src/data/recipe-photos.json"
          photos = json.loads(photos_path.read_text())
          photos[slug] = {
              "url": f"/images/recipes-v2/{slug}.webp",
              "thumbnailUrl": f"/images/recipes-v2/{slug}-480.webp",
              "width": 800,
              "height": 600,
              "thumbnailWidth": 480,
              "thumbnailHeight": 360,
              "author": "WorldBites",
              "license": "WorldBites original image",
              "source": f"https://worldbitesapp.com/images/recipes-v2/{slug}.webp",
              "licenseUrl": "https://worldbitesapp.com",
              "provider": "WorldBites"
          }
          photos_path.write_text(json.dumps(photos, ensure_ascii=False, indent=2) + "\n")

          recipes_path = root / "src/data/recipes-reviewed.json"
          recipes = json.loads(recipes_path.read_text())
          for recipe in recipes:
              if recipe.get("slug") == slug:
                  recipe["image"] = f"/images/recipes-v2/{slug}.webp"
                  break
          else:
              raise SystemExit("Asado argentino recipe not found")
          recipes_path.write_text(json.dumps(recipes, ensure_ascii=False, indent=2) + "\n")

          audit_path = root / "docs/recipe-photo-audit.json"
          audit = json.loads(audit_path.read_text())
          remote = sum(1 for photo in photos.values() if str(photo.get("url", "")).startswith("http"))
          audit["runtimeExternalImages"] = remote
          if "counts" in audit:
              audit["counts"]["added"] = max(0, int(audit["counts"].get("added", 0)) - 1)
              audit["counts"]["original"] = int(audit["counts"].get("original", 0)) + 1
          audit["notes"] = (
              f"All {audit.get('totalRecipes', len(recipes))} recipes have reviewed imagery. "
              f"{len(recipes)-remote} recipes ship local assets; {remote} recent recipes use "
              "attributed Wikimedia Commons photographs with responsive source URLs."
          )

          full_bytes = full.read_bytes()
          for item in audit.get("photos", []):
              if item.get("slug") == slug:
                  item.clear()
                  item.update({
                      "slug": slug,
                      "dishName": "Asado argentino a la parrilla",
                      "status": "original",
                      "title": "Asado argentino a la parrilla",
                      "source": f"https://worldbitesapp.com/images/recipes-v2/{slug}.webp",
                      "author": "WorldBites",
                      "license": "WorldBites original image",
                      "licenseUrl": "https://worldbitesapp.com",
                      "sourceImage": f"/images/recipes-v2/{slug}.webp",
                      "webpSha256": hashlib.sha256(full_bytes).hexdigest(),
                      "webpBytes": len(full_bytes),
                      "thumbnailBytes": thumb.stat().st_size,
                      "crop": None
                  })
                  break
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + "\n")

          print({
              "full": full.stat().st_size,
              "thumbnail": thumb.stat().st_size,
              "remote_images": remote
          })
          PY
          rm -rf .tmp-asado

      - name: Commit imported image
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .tmp-asado \
            atlas-gastronomico/public/images/recipes-v2/asado-argentino-a-la-parrilla.webp \
            atlas-gastronomico/public/images/recipes-v2/asado-argentino-a-la-parrilla-480.webp \
            atlas-gastronomico/src/data/recipe-photos.json \
            atlas-gastronomico/src/data/recipes-reviewed.json \
            atlas-gastronomico/docs/recipe-photo-audit.json
          git commit -m "Use new Argentine asado photo for recipe and cover"
          git push origin HEAD:fix/argentina-asado-photo-20260923
