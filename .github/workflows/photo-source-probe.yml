name: Specific recipe photo sources
on:
  push:
    branches: [fix/recipe-photos-2026-09-20]
    paths: ['.github/workflows/photo-source-probe.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install Pillow==11.3.0
      - name: Collect precisely named dishes for visual review
        run: python3 atlas-gastronomico/scripts/review-additional.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldbites-specific-candidates
          path: specific-candidates/
          retention-days: 7
