name: Final exact photo sources
on:
  push:
    branches: [fix/recipe-photos-2026-09-20]
    paths: ['.github/workflows/photo-source-probe.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install Pillow==11.3.0
      - name: Fetch exact source files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast
          path=Path('atlas-gastronomico/scripts/review-additional.py')
          tree=ast.parse(path.read_text())
          exact={'tortilla-espanola':['File:Spanish Tortilla (5845088254).jpg','File:Tortilla de patata típica de Betanzos.jpg'], 'cecina-de-yecapixtla':['File:Taco de cecina en el mercado de Tepoztlán.JPG']}
          for node in tree.body:
              if isinstance(node,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='queries' for t in node.targets):
                  node.value=ast.parse(repr(exact),mode='eval').body
          exec(compile(ast.fix_missing_locations(tree),str(path),'exec'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: worldbites-final-candidates
          path: specific-candidates/
          retention-days: 7
