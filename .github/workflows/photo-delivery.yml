name: Publish reviewed recipe photos to recovery branch
on:
  push:
    branches: [fix/recipe-photos-2026-09-20]
    paths: ['.github/workflows/photo-delivery.yml']
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: reviewed-photo-delivery
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/fix/recipe-photos-2026-09-20'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atlas-gastronomico/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: worldbites-photo-candidates
          run-id: 35534215323
          github-token: ${{ github.token }}
          path: .photo-cache/commons
      - uses: actions/download-artifact@v4
        with:
          name: worldbites-additional-candidates
          run-id: 35534809168
          github-token: ${{ github.token }}
          path: .photo-cache/flickr
      - uses: actions/download-artifact@v4
        with:
          name: worldbites-specific-candidates
          run-id: 35535125602
          github-token: ${{ github.token }}
          path: .photo-cache/specific
      - uses: actions/download-artifact@v4
        with:
          name: worldbites-final-candidates
          run-id: 35535324012
          github-token: ${{ github.token }}
          path: .photo-cache/final
      - name: Build and validate selected local WebP assets
        run: |
          set -euo pipefail
          python3 -m pip install Pillow==11.3.0
          mkdir -p image-delivery
          python3 atlas-gastronomico/scripts/deliver-media.py | tee image-delivery/image-audit.txt
          git diff --check
      - name: Persist the binary-image checkpoint without touching main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-gastronomico/public/images/recipes-v2 atlas-gastronomico/src/data/recipe-photos.json atlas-gastronomico/docs/recipe-photo-audit.json atlas-gastronomico/docs/recipe-photography.md
          git commit -m 'feat(images): save reviewed WebP photographs, thumbnails and complete provenance'
          git push origin HEAD:refs/heads/fix/recipe-photos-2026-09-20
      - name: Integrate responsive cards, country covers and recipe metadata
        run: |
          git apply --check .github/recipe-ui.patch
          git apply .github/recipe-ui.patch
          cp .github/image-integration/recipe-images.ts atlas-gastronomico/src/data/recipe-images.ts
          cp .github/image-integration/destination-photos.ts atlas-gastronomico/src/data/destination-photos.ts
      - name: Test and compile the application
        working-directory: atlas-gastronomico
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm ci
          npm test 2>&1 | tee ../image-delivery/tests.txt
          npx tsc --noEmit 2>&1 | tee ../image-delivery/typescript.txt
          npm run build 2>&1 | tee ../image-delivery/build.txt
      - name: Save validated integration only on the recovery branch
        run: |
          git diff --check
          git diff --exit-code -- atlas-gastronomico/src/data/recipes-reviewed.json atlas-gastronomico/src/data/recipe-translations atlas-gastronomico/public/geo
          git add atlas-gastronomico/src/components/RecipeCard.tsx 'atlas-gastronomico/src/app/[locale]/page.tsx' 'atlas-gastronomico/src/app/[locale]/receta/[slug]/page.tsx' atlas-gastronomico/src/data/recipe-images.ts atlas-gastronomico/src/data/destination-photos.ts
          git commit -m 'feat(images): use reviewed photos for recipe pages, responsive cards and eleven country covers'
          git push origin HEAD:refs/heads/fix/recipe-photos-2026-09-20
          git rev-parse HEAD > image-delivery/validated-commit.txt
          git archive --format=zip --output=image-delivery/worldbites-reviewed-photos.zip HEAD atlas-gastronomico netlify.toml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldbites-photo-delivery
          path: image-delivery/
          retention-days: 7
