# Configuración de Netlify para el Atlas Gastronómico (Next.js)
# La app vive en la subcarpeta atlas-gastronomico/

[build]
  base = "atlas-gastronomico"
  command = "next build"
  # Carpeta de salida de Next.js, RELATIVA al base (atlas-gastronomico).
  # Resultado final: atlas-gastronomico/.next
  publish = ".next"

# Plugin oficial que permite a Netlify ejecutar Next.js (rutas dinámicas /es, /en, etc.)
[[plugins]]
  package = "@netlify/plugin-nextjs"
